<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<!--
  Modelo das imagens de preview (og:image), 1200x630.
  Gerar de novo depois de mudar algo aqui:
    chrome --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 --screenshot=og/og-freelance.png "file:///.../og/modelo.html?p=freelance"
    chrome --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 --screenshot=og/og-index.png "file:///.../og/modelo.html?p=index"
-->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{
  --bg:#0E1420;--bg-2:#131B2A;--surface:#172133;--line:#243149;--line-soft:#1c2740;
  --ink:#E9EDF4;--muted:#8A97AC;--muted-2:#5D6B82;--amber:#E8B04B;--cyan:#6FD3E0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;
  background-image:
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size:64px 64px;background-position:-1px -1px;
  padding:64px 72px;display:flex;flex-direction:column;position:relative;
}
.top{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:22px}
.brand b{color:var(--amber);font-weight:500}
.brand span{color:var(--muted-2)}
.status{display:flex;align-items:center;gap:12px;color:var(--amber);font-size:18px;letter-spacing:.12em;text-transform:uppercase}
.status i{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 5px rgba(232,176,75,.18)}
.eyebrow{margin-top:auto;font-family:'IBM Plex Mono',monospace;font-size:19px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:16px;margin-bottom:24px}
.eyebrow::before{content:"";width:46px;height:2px;background:var(--amber)}
h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:96px;line-height:.95;letter-spacing:-.03em}
h1 .l2{color:var(--muted-2)}
.foot{margin-top:34px;display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.lede{font-size:25px;color:var(--muted);max-width:30ch;line-height:1.4}
.lede b{color:var(--ink);font-weight:500}
.url{font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--ink);border:1px solid var(--line);background:var(--bg-2);padding:14px 20px;border-radius:10px;white-space:nowrap}
.url span{color:var(--amber)}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">Paulo<b>Ot</b> <span id="tag">// freelance</span></div>
    <div class="status"><i></i><span id="status">Aceitando projetos</span></div>
  </div>
  <div class="eyebrow" id="eyebrow">Sites · Sistemas · Automações</div>
  <h1 id="titulo">Seu site ou sistema,<br><span class="l2">feito sob medida.</span></h1>
  <div class="foot">
    <p class="lede" id="lede">Orçamento <b>sem compromisso</b>, direto comigo, do esboço até o site no ar.</p>
    <div class="url" id="url">portifolio-paulot.vercel.app<span>/freelance.html</span></div>
  </div>
<script>
const p = new URLSearchParams(location.search).get('p');
if (p === 'index') {
  document.getElementById('tag').textContent = '// dev';
  document.getElementById('status').textContent = 'Aberto a oportunidades';
  document.getElementById('eyebrow').textContent = 'Dev Fullstack · São Paulo';
  document.getElementById('titulo').innerHTML = 'Paulo Otávio<br><span class="l2">Santos de Jesus</span>';
  document.getElementById('lede').innerHTML = '<b>React, Node e TypeScript</b>, com sistema web em produção na MLEGATE.';
  document.getElementById('url').innerHTML = 'portifolio-paulot.vercel.app';
}
</script>
</body>
</html>
